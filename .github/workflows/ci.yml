name: CI

on:
  push:
    branches: [ master, main, feat/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test
